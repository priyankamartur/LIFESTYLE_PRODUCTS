# Database Configuration with Dynamic Fallbacks
# Uses MySQL if SPRING_DATASOURCE_URL is configured; otherwise defaults to H2 In-Memory DB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lifestyle_products;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Port (Cloud platforms like Render/Railway pass PORT dynamically)
server.port=${PORT:8081}

# JWT Configuration
lifestyle.app.jwtSecret=${JWT_SECRET:======================LifestyleProductsSecretKeyJWT2026===================}
lifestyle.app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}

