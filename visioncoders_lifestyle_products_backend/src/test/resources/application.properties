# Application Name
spring.application.name=products

# Server Port
server.port=8081

# Database Configuration with H2 In-Memory Fallback for Tests
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lifestyle_products_test;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

